<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Media Control for Firefox</title>
  <desc id="d">A music note icon next to the name Media Control and the tagline: the Chrome-style media button, for Firefox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c26"/>
      <stop offset="0.6" stop-color="#262338"/>
      <stop offset="1" stop-color="#3b2c63"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34364a"/>
      <stop offset="1" stop-color="#22232f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4f8"/>
      <stop offset="1" stop-color="#c58af9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="190" fill="#8ab4f8" opacity="0.06"/>
  <circle cx="1230" cy="300" r="150" fill="#c58af9" opacity="0.07"/>

  <!-- app icon -->
  <rect x="96" y="76" width="168" height="168" rx="40" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <path fill="#ffffff" transform="translate(130 110) scale(4)" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>

  <!-- title -->
  <text x="304" y="158" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-1">Media Control</text>
  <text x="306" y="208" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#b9bbd3">The Chrome-style media button, for Firefox.</text>

  <!-- decorative mini player -->
  <g transform="translate(958 100)">
    <rect width="226" height="120" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="26" y="32" width="174" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="26" y="32" width="78" height="6" rx="3" fill="url(#bar)"/>
    <circle cx="104" cy="35" r="9" fill="#8ab4f8"/>
    <g fill="#ffffff">
      <path d="M48 77h4v20h-4zm7 10l14-10v20z" opacity="0.9"/>
      <circle cx="113" cy="87" r="21" fill="#e8eaed"/>
      <path d="M106 77v20l16-10z" fill="#1b1c26"/>
      <path d="M178 77h-4v20h4zm-7 10l-14-10v20z" opacity="0.9"/>
    </g>
  </g>
</svg>
